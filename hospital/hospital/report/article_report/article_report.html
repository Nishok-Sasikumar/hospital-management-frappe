<table class="table table-bordered">
    <thead>
        <tr>
            <% for (var i = 0; i < columns.length; i++) { %>
                <th><%= columns[i].label %></th>
            <% } %>
        </tr>
    </thead>

    <tbody>
        <% for (var i = 0; i < data.length; i++) { %>
            <tr>
                <td><%= data[i].title %></td>
                <td><%= data[i].status %></td>
                <td><%= format_money(data[i].amount) %></td>
                <td><%= dateutil.str_to_user(data[i].posting_date) %></td>
            </tr>
        <% } %>
    </tbody>
</table>
