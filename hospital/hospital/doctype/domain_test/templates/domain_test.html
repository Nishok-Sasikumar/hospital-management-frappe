{% extends "templates/web.html" %}

{% block page_content %}
<div class="hero">
  <h1 class="title">Hello Nishok 👋</h1>
  <div class="card">
    <img src="{{ doc.image }}" alt="Domain Test Image" class="image">
    <p class="caption">This is your dynamic Frappe image field rendered beautifully.</p>
  </div>
</div>

<style>
  .hero {
    text-align: center;
    padding: 40px;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    color: #fff;
    border-radius: 12px;
    animation: fadeIn 1.2s ease-in-out;
  }

  .title {
    font-size: 2.5rem;
    margin-bottom: 20px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  .card {
    display: inline-block;
    background: #fff;
    color: #333;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    transition: transform 0.3s ease;
  }

  .card:hover {
    transform: scale(1.05);
  }

  .image {
    max-width: 100%;
    height: auto;
    border-radius: 10px;
    margin-bottom: 10px;
  }

  .caption {
    font-size: 1rem;
    font-style: italic;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
{% endblock %}

{% block sidebar %}
<!-- Optional sidebar content -->
{% endblock %}
